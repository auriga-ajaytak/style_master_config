<!DOCTYPE html>
<html>
<head>
<style>

body{
 color:black;
 font-size:25px;
}
td,tr, th{
    border: 1px solid #ebe1e1e8;
  text-align: left;
  padding: 8px;


 border-collapse: collapse;
 cursor:all-scroll;
}

table{
    font-family: arial, sans-serif;
  width: 100%;
 border-collapse: collapse;
 -webkit-user-select: none; /* Safari */
 -ms-user-select: none; /* IE 10+ and Edge */
 user-select: none; /* Standard syntax */
 margin:0 auto;
}

</style>
</head>
<body>

<table id="ob_table_{{rand_id}}" >
  {% for x in data %}
  <tr draggable="true" ondragstart="cur_frm.start()"  ondragover="cur_frm.dragover()">
    <td id="operation-{{x.idx}}">{{x.label}}</td>
    {% if x.default == 1 %}
    <td><input type="checkbox" id="check-{{x.idx}}" checked onchange="cur_frm.update_html_tbl()"></td>
    {% endif %}

    {% if x.default == 0 %}
    <td><input type="checkbox" id="check-{{x.idx}}"  onchange="cur_frm.update_html_tbl()"></td>
    {% endif %}
    
  </tr>
  {% endfor %}
 
</table>

</body>
</html>
